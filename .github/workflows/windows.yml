name: Windows
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generator dependencies
        run: python -m pip install -r tools/build-requirements.txt
      - name: Configure
        run: cmake --preset windows-vs2022
      - name: Build
        run: cmake --build --preset vs2022-release --parallel
      - name: CPU tests
        run: ctest --test-dir build/vs2022 -C Release --output-on-failure
      - name: Install
        run: cmake --install build/vs2022 --config Release --prefix out/WorldForge
      - uses: actions/upload-artifact@v4
        with:
          name: WorldForge-Windows-framework
          path: out/WorldForge
      # Hosted Windows runners do not promise OpenGL 4.5. GPU validation is local.
